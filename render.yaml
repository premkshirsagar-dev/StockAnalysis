services:
  - type: web
    name: stock-market-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: MARKET_DATA_MODE
        value: upstox
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_CACHE_SECONDS
        value: 15
      - key: UPSTOX_INSTRUMENT_KEYS
        value: ""
